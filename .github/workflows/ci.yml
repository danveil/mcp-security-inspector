name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest --cov=mcpsec --cov-report=term-missing --cov-report=xml
      - name: Build and smoke-test the installed wheel
        run: |
          python -m build --wheel
          python scripts/smoke_wheel.py dist/*.whl
      - name: Validate bundled synthetic evaluation corpus
        run: mcpsec evaluate evaluation/corpus/manifest.json --format json --output evaluation-result.json
      - name: Offline clean-catalog policy example
        run: mcpsec scan examples/clean_tools.json --fail-on high
