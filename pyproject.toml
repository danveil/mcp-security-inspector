[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mcp-tool-security-inspector"
version = "0.2.0"
description = "Deterministic defensive static analysis for MCP tool definitions"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MCP Tool Security Inspector contributors" }]
dependencies = [
  "mcp>=2.0,<3",
  "httpx2>=2.5,<3",
  "typer>=0.12,<1",
  "rich>=13.7,<15",
  "pydantic>=2.8,<3",
  "PyYAML>=6.0,<7",
  "jsonschema>=4.23,<5",
]

[project.optional-dependencies]
dev = [
  "build>=1.2,<2",
  "pytest>=8.3",
  "pytest-cov>=5",
  "ruff>=0.9",
  "mypy>=1.14",
  "types-PyYAML>=6.0",
  "types-jsonschema>=4.23",
]

[project.scripts]
mcpsec = "mcpsec.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpsec"]

[tool.hatch.build.targets.wheel.force-include]
"src/mcpsec/resources/mixed_tools.json" = "mcpsec/resources/mixed_tools.json"

[tool.pytest.ini_options]
addopts = "--strict-markers --cov=mcpsec --cov-report=term-missing"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["mcpsec"]

[tool.coverage.report]
show_missing = true
fail_under = 85

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["mcpsec"]
